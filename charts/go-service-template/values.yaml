serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The role name (<name>) from env-lib's <environment>.roles.<name>
  # Setting this will set the "eks.amazonaws.com/role-arn" annotation
  awsRole: ""
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  role: # see: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#role-example
    create: false
    namespace: null
    rules:
    - apiGroups: []
      resources: []
      verbs: []
  clusterRole:  # see: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#clusterrole-example
    create: false
    rules:
    - apiGroups: []
      resources: []
      verbs: []


podAnnotations: {}

podLabels: {}
  # This setting will add the `com.lightspeed.helm/node-exclusive` label to the pod.
  # The label is used to indicate that the service cannot be scaled to more than 1 replica.
  # This label is used in conjunction with `soft-node-exclusive-anti` affinity preset to ensure
  # that the Kubernetes scheduler only schedules one service with this label per node.
  # com.lightspeed.helm/node-exclusive: "true"

# Those secure defaults for containers are designed to work out of the box with our base images
# See https://docs.lsk.lightspeed.app/Tutorials/rootless-services/ for details
podSecurityContext:
  runAsGroup: 3000
  runAsUser: 1000

# Those secure defaults for pods are designed to work out of the box with our base images
# See https://docs.lsk.lightspeed.app/Tutorials/rootless-services/ for details
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  # capabilities:
  #   drop:
  #   - ALL

service:
  type: ClusterIP
  annotations: {}
  ports:
    - port: 80
      targetPort: http
      name: http

headlessService: {}
#  enabled: false
#  type: ClusterIP
#  ports:
#    - port: 5701
#      targetPort: hazelcast
#      name: hazelcast

# Deprecated! Use "default" ingress definition of "ingresses" dict below
ingress:
  enabled: false
  stickySessions: false
  serverAlias: '{{ include "starter-lib.ingress-alias" ( list $  "default" ) }}'
  configurationSnippet: "httpsWorkaround"
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: '{{ include "env-lib.get" ( list $ "domains.default.ingressHost" ) }}'
      paths: ["/"]
  tls: []

# Allows specifying multiple ingresses definitions.
ingresses:
  default:
    enabled: false
    stickySessions: false
    serverAlias: '{{ include "starter-lib.ingress-alias" ( list $  "default" ) }}'
    configurationSnippet: "httpsWorkaround"
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: '{{ include "env-lib.get" ( list $ "domains.default.ingressHost" ) }}'
        paths: ["/"]
    tls: []

resources:
  requests:
    memory: 600Mi # Change if you're doing something fancy
  #   cpu: 100m
  # limits:
  #   cpu: 100m
  #   memory: 1200Mi

rollingUpdate:
  maxSurge: "25%"
  maxUnavailable: "25%"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

# To disable all presets:
#affinityPresets: []
# To enable some presets (preset names are in starter-lib/templates/_affinity.tpl)
#affinityPresets: ["hard-anti", "soft-anti", "soft-node-exclusive-anti"]
affinityPresets: ["default"]
# extra affinity is merged with the presets
extraAffinity: {}

# disable PDB with
# pdb: null
pdb:
  minAvailable: 1
#  maxUnavailable: 1 # choose maxUnavailable or minAvailable

# To disable all presets:
#topologySpreadPresets: []
# To enable some presets (preset names are in starter-lib/templates/_topology_spread_presets.yaml)
#topologySpreadPresets: ["soft", "some-other"]
topologySpreadPresets: ["default"]
# Extra constraint can be added here, must be a dict.
extraTopologySpreadConstraint: {}


# Reroute traffic for this pod
hostAliases: '{{- include "starter-lib.blocked-domains" $ }}'

# serviceMapping sets the DD_SERVICE_MAPPING env var to separate things relevant to this service in the APM UI
# serviceMapping:
#   mysql: "{{ $.Release.Name }}-mysql"
#   redis: "{{ $.Release.Name }}-redis"
#   kafka: "{{ $.Release.Name }}-kafka"
apm:
  datadog:
    enabled: false
    environment: ""
    serviceMapping: {}

priorityClass:
  enabled: false
  annotations: {}
  value: 9001
  preemptionPolicy: PreemptLowerPriority
  description: Priority class for go-service-template

openapi:
  # When enabled, this will create the OpenAPI custom resource.  Please create a symlink to the
  # [repo]/apidoc/[chart-name] dir for this chart so the file gets added to the OpenAPI CR properly like this:
  # cd charts/[chart-name]
  # ln -s ../../apidoc/[chart-name] apidoc
  #
  # Results in: [repo]/charts/[chart-name]/apidoc --> ../../apidoc/[chart-name]
  enabled: false
  # filename: openapi-manual.yaml
  # Priority is a negative or positive integer.  Allows us to specify the order at which documents
  # override each other, where the document with a higher priority value overwrites lower priority documents.
  # priority: 0
