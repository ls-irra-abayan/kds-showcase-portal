replicaCount: 1

nameOverride: go-service-template # Overrides what would otherwise be {Chart.Name}
fullnameOverride: go-service-template # Used for the service name

image:
  name: null # Default is .Chart.Name
  pullPolicy: IfNotPresent
  tag: null # Default is appVersion.
  registry: null # Default is based on environment
  useEcr: null # Set to true in ephemeral by default if you don't set the registry. Set to true to use the {temp,release}/service/image convention.


